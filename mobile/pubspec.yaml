# Brak folderów android/ios? W tym katalogu: flutter create . && flutter pub get
# Firebase: flutterfire configure (lub dodaj google-services.json / GoogleService-Info.plist).
name: sellektywni_shop
description: Aplikacja sklepu odzieżowego SELLEKTYWNI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
