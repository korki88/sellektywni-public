# CI bez sekretów: generuje Prisma Client i buduje Nest.
# Sekrety (DATABASE_URL itd.) dodaj dopiero przy jobach z testami DB / deployem — patrz sync/SECRETS.md.

name: CI

on:
  push:
    branches: [main, main-home, 'feature/**']
  pull_request:
    branches: [main, main-home]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build NestJS
        run: npm run build
